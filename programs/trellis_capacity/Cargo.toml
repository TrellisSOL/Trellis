[package]
name = "trellis_capacity"
version = "0.1.0"
description = "Trellis Bushels: bond-backed prepaid capacity commitments and key-bound lots, plus the write-only HVX feed (Backend spec section 5.6)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "trellis_capacity"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "trellis_bond/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# DEVNET ONLY: compiles the short devnet floors and timelock (src/state.rs). Mainnet builds must not enable it.
devnet = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"
trellis_bond = { path = "../trellis_bond", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
