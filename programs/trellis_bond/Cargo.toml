[package]
name = "trellis_bond"
version = "0.1.0"
description = "Trellis host bonds: post, unbond, slash with a public dispute window (Backend spec section 5.3)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "trellis_bond"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# DEVNET ONLY: compiles the short devnet floors and timelock (src/state.rs). Mainnet builds must not enable it.
devnet = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
