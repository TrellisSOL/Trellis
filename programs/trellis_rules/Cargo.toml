[package]
name = "trellis_rules"
version = "0.1.0"
description = "Trellis agent rulebooks (spend limits, allowlists, kill switch)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "trellis_rules"

[features]
default = []
# Enable `cpi` from another program (e.g. trellis_tab):
#   trellis_rules = { path = "../trellis_rules", features = ["cpi"] }
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# DEVNET ONLY: compiles the short devnet timelock (src/constants.rs). Mainnet builds must not enable it.
devnet = []

[dependencies]
anchor-lang = "1.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
