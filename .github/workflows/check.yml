name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check public file list
        run: |
          python3 - <<'PYTHON'
          import pathlib, subprocess
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in filter(None, paths):
              p = pathlib.PurePosixPath(name)
              if (p.suffix.lower() in {".md", ".mdx", ".txt", ".rst", ".adoc", ".doc", ".docx", ".pdf", ".zip"} and
                  name != "README.md" and not (p.parent == pathlib.PurePosixPath("spec") and p.suffix == ".md") and
                  p.name != "requirements.txt" and p.parent != pathlib.PurePosixPath("security/launch-surface")):
                  raise SystemExit(f"Unexpected document in public source: {name}")
          PYTHON
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
