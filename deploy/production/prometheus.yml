# Prometheus for the single-host stack (profile "monitoring" of docker-compose.yml). The rules are monitoring/alerts.yml.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/trellis-alerts.yml]
scrape_configs:
  # The router's readiness checks as gauges (GET /ready/metrics).
  - job_name: trellis
    metrics_path: /ready/metrics
    scrape_timeout: 5s
    static_configs:
      - targets: [api:8787]
  # The chain monitor (scripts/monitor.ts --chain): authority drift, anchor lag, signer balances, vault reconciliation.
  - job_name: trellis-chain
    metrics_path: /metrics
    scrape_interval: 60s
    scrape_timeout: 10s
    static_configs:
      - targets: [chain-monitor:9797]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
