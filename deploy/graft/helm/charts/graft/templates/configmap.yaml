{{- include "graft.checkClaims" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graft.fullname" . }}
  labels:
    {{- include "graft.labels" . | nindent 4 }}
data:
  graft.yaml: |
    {{- toYaml .Values.graft | nindent 4 }}
  sidecar.yaml: |
    # Written by the graft chart from values. Every setting: sidecar/sidecar.example.yaml.
    server:
      host: 0.0.0.0
      port: {{ .Values.sidecar.port }}
      tls: self_signed
    upstream:
      base_url: {{ .Values.graft.engine_url | quote }}
    model:
      {{- if .Values.sidecar.measureWeights }}
      path: /models/model
      {{- else }}
      digest: {{ .Values.graft.model.weights_sha256 | quote }}
      {{- end }}
      {{- with .Values.graft.model.served_name }}
      served_name: {{ . | quote }}
      {{- end }}
    allowlist:
      model_digests: [{{ .Values.graft.model.weights_sha256 | quote }}]
    attestation:
      provider: {{ .Values.sidecar.attestation }}
    auth:
      keys:
        - id: router
          sha256: {{ required "sidecar.routerKeySha256 is required (the SHA-256 of the router API key)" .Values.sidecar.routerKeySha256 | quote }}
