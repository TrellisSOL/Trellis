[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Size over speed: every byte of a deployed program is paid for in rent for as long as it lives, and no instruction here
# is near the compute limit (the heaviest, a tab close, uses a fraction of the default budget).
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
